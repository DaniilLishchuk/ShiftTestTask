<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация продавца</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4>Регистрация в CRM</h4>
                </div>
                <div class="card-body p-4">
                    <div th:if="${param.error}" class="alert alert-danger">
                        Пользователь с таким Email уже существует!
                    </div>

                    <form action="/register" method="post">
                        <div class="mb-3">
                            <label class="form-label">ФИО</label>
                            <input type="text" name="name" class="form-control" required placeholder="Иванов Иван">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email (Логин)</label>
                            <input type="email" name="contactInfo" class="form-control" required placeholder="name@example.com">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Пароль</label>
                            <input type="password" name="password" class="form-control" required placeholder="Придумайте пароль">
                        </div>
                        <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="/login" class="text-decoration-none">Уже есть аккаунт? Войти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
