<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4>Вход в CRM систему</h4>
                </div>
                <div class="card-body p-4">

                    <div th:if="${param.registered}" class="alert alert-success">
                        Регистрация успешна! Войдите, используя свои данные.
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Неверный Email или пароль!
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email (Логин)</label>
                            <input type="email" name="username" class="form-control" required placeholder="name@example.com">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Пароль</label>
                            <input type="password" name="password" class="form-control" required placeholder="Введите пароль">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Войти</button>
                    </form>

                    <hr class="my-4">
                    <div class="text-center">
                        <span class="text-muted">Ещё нет аккаунта?</span>
                        <a href="/register" class="btn btn-outline-success btn-sm ms-2">Создать аккаунт</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
